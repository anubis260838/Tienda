<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique Temporal - Investigación</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        header {
            text-align: center;
            padding: 30px 20px;
            background-color: #ffffff;
            border-bottom: 1px solid #eaeaea;
        }
        header h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            margin: 0;
        }
        .catalogo {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            flex-wrap: wrap;
        }
        .producto {
            background: #ffffff;
            border: 1px solid #eaeaea;
            padding: 15px;
            width: 240px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .producto-imagen {
            background-color: #f0f0f0;
            font-size: 70px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .producto h3 {
            font-size: 1.1rem;
            margin: 10px 0 5px 0;
        }
        .precio {
            color: #888;
            font-weight: bold;
            margin-bottom: 15px;
        }
        button {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header>
        <h1>ABS</h1>
        <P> Comercio Electrónico De Ropa ABS</p>
    </header>

    <main class="catalogo">
      
                <!-- Producto 1 -->
      
        <div class="producto">
            <img class="producto-foto" src="<a href="https://ibb.co/B24FyfY7"><img src="https://i.ibb.co/B24FyfY7/7307f31d-6a7c-4914-9209-16c5f442bf48.jpg" alt="7307f31d-6a7c-4914-9209-16c5f442bf48" border="0"></a>"     <alt="Camiseta">
            <h3>ABS Core T-Shirt </h3>
            <p class="precio">$25.000 COP</p>
            <button onclick="simularCompra('Camiseta Basic')">Comprar Ahora</button>
        </div>

        <!-- Producto 2 -->
        <div class="producto">
            <img class="producto-foto" src="<a href="https://ibb.co/0jZVnWby"><img src="https://i.ibb.co/0jZVnWby/370a26a0-21dd-49d7-bab4-b398e823c857.jpg" alt="370a26a0-21dd-49d7-bab4-b398e823c857" border="0"></a>"     <alt="chaqueta">
            <h3>ABS Patterned Bomber</h3>
            <p class="precio">75.000 COP</p>
            <button onclick="simularCompra('Camiseta Basic')">Comprar Ahora</button>
        </div>
    </main>

    <script>
        function simularCompra(producto) {
            alert("¡Clic registrado con éxito!\nHas seleccionado: " + producto + ".\n(Simulación para fines de investigación).");
        }
    </script>

</body>
</html>
